name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests + lint (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile every module
        run: python -m compileall -q . -x '(\.venv|\.git)'

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Dependency audit
        # معلومة لا بوابة: تنبيه أمني جديد في اعتمادية غير مثبتة لا يمنع الدمج.
        continue-on-error: true
        run: pip-audit -r requirements-lock.txt --no-deps --disable-pip
