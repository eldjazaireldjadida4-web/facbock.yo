name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests + lint (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Byte-compile every module
        run: python -m compileall -q . -x '(\.venv|\.git)'

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (summary line required)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short | tee pytest-output.txt
          grep -qE '[0-9]+ (passed|failed|error)' pytest-output.txt

      - name: Dependency audit
        run: pip-audit -r requirements-lock.txt --no-deps --disable-pip
