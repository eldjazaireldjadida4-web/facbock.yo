name: Release (Windows installer)

# Builds the Windows installer (PyInstaller one-dir bundle + Inno Setup)
# and attaches it to a GitHub release.
#
# Trigger: push a version tag (git tag v4.49.25 && git push origin v4.49.25)
# or run it manually from the Actions tab (workflow_dispatch).
#
# IMPORTANT — how this file gets to GitHub: the Muse GitHub App has NO
# Workflows permission, so the usual snapshot push FAILS on workflow
# files with 403 (same trap as .github/workflows/ci.yml in 4.49.22).
# Add this file by hand on GitHub (web UI: Add file → Create new file),
# exactly like ci.yml was added. After that, tags trigger this workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install pyinstaller

      - name: Build one-dir bundle
        run: python -m PyInstaller --clean --noconfirm facbock-yo.spec

      - name: Smoke-test the frozen app
        shell: pwsh
        run: |
          .\dist\facbock-yo\facbock-yo.exe --version
          .\dist\facbock-yo\facbock-yo.exe --help
          # --preflight is EXPECTED to exit 2 in a clean checkout: there
          # is no config.ini, no client_secrets.json and no YouTube token
          # here. Exit 2 with a clean report means "missing credentials",
          # not a crash; anything else fails the job.
          .\dist\facbock-yo\facbock-yo.exe --preflight
          if ($LASTEXITCODE -ne 2) { throw "preflight exit was $LASTEXITCODE, expected 2 (missing credentials)" }
          .\dist\facbock-yo\facbock-yo-doctor.exe
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) { throw "doctor exit was $LASTEXITCODE" }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\facbock-yo.iss

      - name: Upload installer as release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/facbock-yo-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe
          generate_release_notes: true

      - name: Upload installer as workflow artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: facbock-yo-${{ steps.version.outputs.version }}-windows-x86_64-setup
          path: installer-output/facbock-yo-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe
